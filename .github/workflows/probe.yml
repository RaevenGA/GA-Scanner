# Temporary diagnostics: checks the live services the app talks to. Not part of the app.
name: Probe services

on:
  push:
    branches: [claude/**]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e
          note() { echo "::notice title=$1::$(echo "$2" | head -c 3000 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          for shop in https://zarc.pl https://www.zarc.pl; do
            s=$(curl -sL -m 25 -A "Mozilla/5.0" -o /tmp/s.json -w '%{http_code} %{content_type} %{url_effective}' "$shop/search/suggest.json?q=lorraine&resources%5Btype%5D=product&resources%5Blimit%5D=3")
            w=$(curl -sL -m 25 -A "Mozilla/5.0" -o /tmp/w.json -w '%{http_code} %{content_type}' "$shop/wp-json/wc/store/v1/products?search=lorraine&per_page=3")
            curl -sL -m 25 -A "Mozilla/5.0" "$shop/" -o /tmp/home.html
            h=$(grep -o -iE 'shopify|woocommerce|prestashop|shoper|wp-content|magento|idosell|sky-shop|shopgold|redcart|comarch|sote|presta|opencart|nuxt|next' /tmp/home.html | tr A-Z a-z | sort | uniq -c | tr '\n' ' ')
            f=$(grep -o -iE '<form[^>]*(search|szukaj)[^>]*>' /tmp/home.html | head -3 | tr '\n' ' ')
            i=$(grep -o -iE 'name="[a-z_]*(search|query|q|s|phrase|szukaj)[a-z_]*"' /tmp/home.html | sort -u | head -5 | tr '\n' ' ')
            note "zarc $shop" "shopify:$s $(head -c 300 /tmp/s.json) || woo:$w $(head -c 300 /tmp/w.json) || page:$h || form:$f || inputs:$i || size:$(wc -c </tmp/home.html)"
          done
          r=$(curl -sL -m 25 "https://caduko.com/wp-json/wc/store/v1/products?search=crescent%20glaive&per_page=5")
          note "caduko items" "$(echo "$r" | jq -c '[.[] | {name, sku, price: .prices.price, cur: .prices.currency_code, minor: .prices.currency_minor_unit, stock: .is_in_stock, cats: [.categories[]?.name]}]' | head -c 2500)"
          r=$(curl -sL -m 25 "https://caduko.com/wp-json/wc/store/v1/products?search=lorraine&per_page=20")
          note "caduko zero prices" "$(echo "$r" | jq -c '[.[] | {name, p: .prices.price, stock: .is_in_stock, purch: .is_purchasable}] | group_by(.p == "0") | map({zero: (.[0].p == "0"), n: length, stock: (map(.stock) | unique), purch: (map(.purch)|unique)})')"
          exit 0
