# Temporary diagnostics, removed before merging.
name: Probe services
on:
  push:
    branches: [claude/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          U=https://tcgcsv.com/tcgplayer/categories
          a=$(curl -s -o /dev/null -w '%{http_code}' -A "okhttp/4.12.0" $U)
          b=$(curl -s -o /dev/null -w '%{http_code}' -A "GAScanner/0.2.1 (Android; +https://github.com/RaevenGA/GA-Scanner)" $U)
          c=$(curl -s -A "GAScanner/0.2.1 (Android; +https://github.com/RaevenGA/GA-Scanner)" $U | jq -c '[.results[] | select(.name|test("Grand Archive";"i")) | {categoryId,name}]')
          z=$(curl -s -o /dev/null -w '%{http_code}' -A "Mozilla/5.0" "https://zarc.pl/pl/searchquery/Throne-Keeper+Bullfrog/")
          echo "::notice title=tcgcsv::okhttp UA: $a · app UA: $b · category: $c · zarc link: $z"
