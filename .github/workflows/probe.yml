# Temporary diagnostics, removed before merging.
name: Probe services
on:
  push:
    branches: [claude/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          note() { echo "::notice title=$1::$(echo "$2" | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          A=https://api.gatcg.com
          o=$(curl -s "$A/option/search")
          note "types" "$(echo "$o" | jq -c '[.type[]?.value]')"
          note "subtypes-boon" "$(echo "$o" | jq -c '[.subtype[]?.value | select(test("BOON|LESSER|GREATER";"i"))]')"
          note "elements" "$(echo "$o" | jq -c '[.element[]?.value]')"
          note "sets" "$(echo "$o" | jq -c '[.set[]? | {value,text}] | .[0:8]')"
          b=$(curl -s "$A/cards/search?type=BOON&page_size=5")
          note "boons" "$(echo "$b" | jq -c '{total_cards, d:[.data[]? | {name, types, subtypes, classes}]}')"
          t=$(curl -s "$A/cards/search?effect=taunt&page_size=3")
          note "taunt" "$(echo "$t" | jq -c '{total_cards, d:[.data[]? | {name, effect_raw, ee: .editions[0].effect_raw}]}')"
          f=$(curl -s "$A/cards/search?effect=floating%20memory&page_size=2")
          note "floating" "$(echo "$f" | jq -c '{total_cards, d:[.data[]? | {name, effect_raw}]}')"
