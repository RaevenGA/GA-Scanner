# Temporary diagnostics, removed before merging.
name: Probe services
on:
  push:
    branches: [claude/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          A=https://api.gatcg.com
          note() { echo "::notice title=$1::$(echo "$2" | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          UA="GAScanner/0.5 (Android; +https://github.com/RaevenGA/GA-Scanner)"
          for gid in 24713; do
            curl -s -A "$UA" https://tcgcsv.com/tcgplayer/74/$gid/products > prod.json
            curl -s -A "$UA" https://tcgcsv.com/tcgplayer/74/$gid/prices > price.json
            p=$(jq -c '[.results[] | select(.name|test("Dante|Lorraine";"i")) | {productId, name, ext: [.extendedData[] | select(.name|test("Number|Rarity")) | .value]}]' prod.json)
            ids=$(echo "$p" | jq '[.[].productId]')
            pr=$(jq -c --argjson ids "$ids" '[.results[] | select(.productId as $x | $ids | index($x)) | {productId, subTypeName, marketPrice}]' price.json)
            note "tcg PRD products" "$p"
            note "tcg PRD prices" "$pr"
            note "tcg PRD rarities" "$(jq -c '[.results[] | .extendedData[] | select(.name=="Rarity") | .value] | group_by(.) | map({(.[0]): length}) | add' prod.json)"
            note "tcg PRD subtypes" "$(jq -c '[.results[].subTypeName] | group_by(.) | map({(.[0]): length}) | add' price.json)"
          done
          c=$(curl -s "https://caduko.com/wp-json/wc/store/v1/products?search=dante%20prodigal&per_page=20")
          note "caduko dante" "$(echo "$c" | jq -c '[.[] | {name, sku, price: .prices.price}]')"
