name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose their "executable" flag.
      - run: chmod +x gradlew

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.txt

      # Compiler errors and warnings are shown on the run's summary page, so the full log isn't needed.
      - name: Report compiler messages
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          strip() { sed -E 's#^(e|w): file://[^ ]*/app/src/main/java/com/gascanner/app/##'; }
          errors=$(grep -E '^e: ' build-output.txt | strip | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          warnings=$(grep -E '^w: ' build-output.txt | strip | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          failure=$(grep -E -A12 '^\* What went wrong' build-output.txt | head -14 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          if [ -n "$errors" ]; then echo "::error title=Kotlin errors::$errors"; fi
          if [ -n "$failure" ]; then echo "::error title=Build failure::$failure"; fi
          if [ -n "$warnings" ]; then echo "::notice title=Kotlin warnings::$warnings"; fi
          apk=$(ls -l app/build/outputs/apk/debug/*.apk 2>/dev/null | awk '{printf "%.1f MB %s", $5/1048576, $9}')
          kt=$(grep -c 'Task :app:compileDebugKotlin' build-output.txt)
          echo "::notice title=Build summary::APK ${apk:-missing} · Kotlin compile tasks: $kt · warnings: $(grep -c '^w: ' build-output.txt)"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ga-scanner-apk
          path: app/build/outputs/apk/debug/*.apk
