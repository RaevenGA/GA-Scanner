name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose their "executable" flag.
      - run: chmod +x gradlew

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.txt

      # Compiler errors and warnings are shown on the run's summary page, so the full log isn't needed.
      - name: Report compiler messages
        if: always()
        shell: bash
        run: |
          strip() { sed -E 's#^(e|w): file://[^ ]*/app/src/main/java/com/gascanner/app/##'; }
          errors=$(grep -E '^e: ' build-output.txt | strip | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          warnings=$(grep -E '^w: ' build-output.txt | strip | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          failure=$(grep -E -A12 '^\* What went wrong' build-output.txt | head -14 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          [ -n "$errors" ] && echo "::error title=Kotlin errors::$errors"
          [ -n "$failure" ] && echo "::error title=Build failure::$failure"
          [ -n "$warnings" ] && echo "::notice title=Kotlin warnings::$warnings"
          ls -l app/build/outputs/apk/debug/ 2>/dev/null | tail -n +2 | sed 's/^/APK: /' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ga-scanner-apk
          path: app/build/outputs/apk/debug/*.apk
